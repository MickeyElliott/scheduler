    if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}});
/* ==== Reference renderers ==== */
function sessionHtml(id){const s=R.sessions[id];if(!s)return '';
  return `<div class="ref-block ref-block--workout"><div class="row mb-4"><span class="tag" style="--c:var(--t-workout)">${esc(id)}</span><span class="faint small mono">~${s.dur} min · ${esc(s.where||'')}</span></div>${s.blocks.map(([t,items])=>`<div class="ref-block"><h4>${esc(t)}</h4>${list(items.flatMap(i=>R.warmups[i]?R.warmups[i]:[i]))}</div>`).join('')}
  ${s.scale?`<div class="callout ${/SKIP/.test(s.scale)?'callout--info':''} mt-4">${esc(s.scale)}</div>`:''}${/pull/i.test(JSON.stringify(s.blocks))&&!/^F/.test(id)?acc('Pull-up level prescriptions',pullTable(),{cls:'acc--quiet'}):''}</div>`}
const pullTable=()=>table(['Level (strict max)','Session prescription','Practice sets'],R.pullup_levels.map(l=>[`<b>${esc(l.level)}</b>`,esc(l.prescription),esc(l.gtg)]));
function dryHtml(id){const d=R.firearms.dry[id];if(!d)return '';return `<div class="ref-block"><div class="faint small mono mb-4">${esc(d.name)} · ${d.min} min</div>${list(d.reps)}${acc('Dry-fire safety protocol (every session)',list(R.firearms.safety),{cls:'acc--quiet'})}</div>`}
function caseBody(c){return `<div class="faint small mono">${esc(c.cite)} · <a href="${esc(c.url)}" target="_blank" rel="noopener">source</a></div><p class="mt-3"><b>Holding.</b> ${esc(c.holding)}</p>${c.factors?`<p>${esc(c.factors)}</p>`:''}<p><b style="color:var(--t-caselaw)">Why it matters for SWAT.</b> ${esc(c.swat)}</p><div class="quiz"><b>Self-quiz:</b> ${esc(c.quiz)}<div class="reveal" tabindex="0" role="button" aria-label="Reveal answer"><b>Answer:</b> ${esc(c.answer)}</div></div>`}
function policyBody(p){return `<div class="faint small mono"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url.replace(/^https?:\/\//,'').slice(0,70))}…</a></div>${list(p.read)}<div class="quiz" style="background:rgba(167,139,250,.07);border-color:rgba(167,139,250,.2)"><b>Self-quiz:</b> ${esc(p.quiz)}</div>`}
function mealTpl(k){const t=R.nutrition.templates[k];return `<div class="ref-block"><h4>${esc(t.name)}</h4>${table(['Time','Meal','What','Macros'],t.meals.map(m=>[`<span class="num">${esc(m[0])}</span>`,`<b>${esc(m[1])}</b>`,esc(m[2]),`<span class="num">${esc(m[3])}</span>`]))}<div class="faint small mt-3">${esc(t.total)}</div></div>`}
function recipeBody(r){return `<div class="faint small mono mb-4">Makes ${esc(r.makes)} · ${esc(r.time)} · ${esc(r.macro)}</div><div class="grid grid-2 grid--tight"><div><h4 class="small">Ingredients</h4>${list(r.ing)}</div><div><h4 class="small">Steps</h4>${olist(r.steps)}</div></div>`}
const MEAL_ICON='<svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>';
const mealsLink=()=>`<a class="link-card" href="meals.html" target="_blank" rel="noopener"><span class="link-card__icon">${MEAL_ICON}</span><span><b>Open the family meal page</b><span class="muted small" style="display:block">Menu, what to pack each work night, Sunday prep steps, grocery checklist, recipes. Plain language, phone-friendly. Text it to your wife.</span></span></a>`;
function liveHtml(){const l=R.firearms.live;return `<div class="ref-block">${list(l.logistics)}${table(['Block','Rounds','Notes'],l.plan.map(p=>[`<b>${esc(p[0])}</b>`,`<span class="num">${esc(p[1])}</span>`,esc(p[2])]))}<div class="callout mt-4">${esc(l.scoring)}</div><button class="btn mt-4" data-go="logs" data-logtab="quals">Open the score sheet →</button></div>`}
function courseTable(rows){return table(['#','Line','Drill','Limit','Rds','Skill'],rows.map(r=>[r[0],`<span class="num">${esc(r[1])}</span>`,esc(r[2]),`<b class="num">${esc(r[3])}</b>`,r[4],`<span class="faint">${esc(r[5])}</span>`]))}
const parHtml=()=>table(['Skill','Wk-1 start par','Sun 12/6 target','Why'],R.firearms.par_table.map(r=>[esc(r[0]),`<span class="num">${esc(r[1])}</span>`,`<span class="num accent-text">${esc(r[2])}</span>`,`<span class="faint">${esc(r[3])}</span>`]));
function appHtml(k){const a=R.app;return `<div class="ref-block"><h4>Deliverables</h4>${list(a.deliverables)}${k!=='brag'?`<h4 class="mt-4">Letter of interest outline (≤ 2 pages)</h4>${olist(a.outline)}`:''}<div class="callout mt-4">${esc(a.brag)}</div></div>`}
function renderRef(ref){if(!ref)return '';const [k,v]=ref.split(':');
  switch(k){
    case 'session':return sessionHtml(v);
    case 'dry':return dryHtml(v);
    case 'case':return v.split(',').map(id=>{const c=R.cases.find(x=>x.id===id);return c?`<div class="ref-block"><h4 style="color:var(--t-caselaw)">${esc(c.name)}</h4>${caseBody(c)}</div>`:''}).join('');
    case 'cases':return `<div class="ref-block">${list(R.cases.map(c=>c.name+': '+c.quiz))}</div>`;
    case 'policy':{if(!v)return list(R.policy.map(p=>p.title));const p=R.policy.find(x=>x.id===v);return p?`<div class="ref-block"><h4 style="color:var(--t-policy)">${esc(p.title)}</h4>${policyBody(p)}</div>`:''}
    case 'meal':return v==='rules'?list(R.nutrition.rules):mealTpl(v)+`<div class="mt-4">${mealsLink()}</div>`;
    case 'recipe':return v==='all'?R.recipes.map(r=>acc(esc(r.name),recipeBody(r))).join(''):(r=>r?recipeBody(r):'')(R.recipes.find(r=>r.id===v));
    case 'grocery':case 'prep':return mealsLink();
    case 'gear':return list(R.gear);
    case 'courses':return acc('VSWAT Pistol qualification',courseTable(R.firearms.courses.pistol))+acc('VSWAT Carbine qualification',courseTable(R.firearms.courses.carbine))+`<div class="faint small mt-3">${esc(R.firearms.courses.rules)}</div>`;
    case 'live':return liveHtml();
    case 'app':return appHtml(v);
    case 'gtg':return pullTable();
    case 'dashboard':return `<button class="btn" data-go="dash">Open progress →</button>`;
    default:return ''}}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(!g)return;e.preventDefault();closeDrawer(true);go(g.dataset.go,g.dataset.logtab?{logTab:g.dataset.logtab}:{})});

/* ==== Day view ==== */
function renderDay(){let date=S.ui.date;if(!dayObj(date)){const t=todayIso();date=dayObj(t)?t:week().days[0].date;S.ui.date=date}
  const d=dayObj(date);if(d.week!==S.ui.week){S.ui.week=d.week;save();$('#weekSelect').value=d.week}
  const days=allDays(),idx=days.findIndex(x=>x.date===date),w=PLAN.weeks.find(x=>x.id===d.week);
  const segs=shiftSegs(date),startsShift=isShiftStart(date),endsShift=segs.some(([a])=>a===0);
  const shiftTag=startsShift?`<span class="tag tag--shift">Shift ${S.settings.shiftStart}–${S.settings.shiftEnd}</span>`:endsShift?`<span class="tag tag--shift">Shift ends ${S.settings.shiftEnd}</span><span class="tag tag--plain" style="--c:var(--text-3)">Off tonight</span>`:'<span class="tag tag--ok">Off day</span>';
  const tabs=w.days.map(x=>{const p=parseD(x.date);return {key:x.date,html:`${DOW[p.getDay()]} ${p.getDate()}<span class="tab__meta" data-day-meta="${x.date}">${dayPct(x)}%</span>`}});
  let h=`<section class="view"><div class="mb-4" style="overflow-x:auto">${tabsHtml('days',tabs,date,{pill:true,label:'Days'})}</div>
  <div class="card day-hero my-5"><div data-day-ring="${date}">${ring(dayPct(d))}</div><div class="day-hero__text"><div class="eyebrow">${DOWL[parseD(date).getDay()]} · ${MON[parseD(date).getMonth()]} ${parseD(date).getDate()} · ${esc(w.label)}</div><h1>${esc(d.title)}</h1><p class="muted" style="margin:0 0 var(--s3)">${esc(d.theme||'')}</p><div class="row">${shiftTag}</div></div>
    <div class="row"><button class="btn" data-addblk="${date}">＋ Add</button><button class="btn" data-nav="${idx-1}" ${idx<=0?'disabled':''} aria-label="Previous day">←</button><button class="btn" data-nav="today">Today</button><button class="btn" data-nav="${idx+1}" ${idx>=days.length-1?'disabled':''} aria-label="Next day">→</button></div></div>
  ${acc('Daily anchors',checklist(R.daily_anchors.map(a=>check(date+'|anchor|'+a.id,esc(a.text)))),{id:'anchors',sub:`${anchorIds(d).filter(i=>S.checks[i]).length}/${R.daily_anchors.length} done · tap to open`})}
  <h2 class="section-title section-title--spaced">Timeline</h2><div class="timeline">`;
  const cards=d.blocks.map((b,i)=>({b,i,s:toMin(b.start)})).concat(segs.map(([a,z])=>({shift:[a,z],s:a}))).sort((x,y)=>x.s-y.s||(x.shift?-1:1));
  cards.forEach(({b,i,shift},n)=>{
    if(shift){h+=`<div class="tl-item" style="--i:${n}"><div class="tl-time">${fmtM(shift[0])}<small>${fmtM(shift[1])}</small></div><div class="tl-card tl-card--shift"><div class="row"><b>On shift · patrol${shift[0]===0?` (${DOW[parseD(addD(date,-1)).getDay()]} night, continued)`:''}</b><span class="faint small">${shift[0]===0?'Ends '+fmtM(shift[1]):'Starts '+fmtM(shift[0])}. Only patrol-friendly items below: eat when calls allow, optional flex gym hour.</span></div></div></div>`;return}
    const done=(b.items.length&&blockPct(b)===100)||b.status==='done';
    h+=`<div class="tl-item" style="--i:${n}"><div class="tl-time">${b.start}<small>${b.end}</small></div><div class="tl-card ${b.flex?'tl-card--flex':''} ${done?'is-done':''} ${b.status==='skipped'?'is-skipped':''}" style="--c:${tcol(b.track)}" data-block="${esc(b.bid)}" id="blk-${hash(b.bid)}">
      <div class="tl-card__head"><span class="tl-card__title">${esc(b.title)}</span>${b.flex?'<span class="tag tag--plain" style="--c:var(--text-3)">Optional</span>':''}${toMin(b.start)<toMin(S.settings.shiftEnd)?carryTag(date,b):''}${statusTag(b)}${editedTag(b)}${tag(b.track)}${b.items.length?`<span class="tl-card__count">${b.items.filter(x=>S.checks[x.id]).length}/${b.items.length}</span>`:''}<button class="btn btn--sm btn--ghost tl-card__edit" data-editblk="${esc(b.bid)}" aria-label="Edit ${esc(b.title)}">✎</button></div>
      ${conflicts(date,b)?'<div class="callout callout--warn">Overlaps your configured shift. Move it.</div>':''}${b.note?`<div class="callout ${b.flex?'callout--info':''}">${esc(b.note)}</div>`:''}
      ${b.items.length?checklist(b.items.map(it=>check(it.id,esc(it.text)))):''}${b.ref?acc('Plan & details',renderRef(b.ref),{cls:'acc--quiet',id:'plan-'+b.bid}):''}</div></div>`});
  h+=`</div></section>`;$('#main').innerHTML=h;animateIn($('#main'));
  bindTabs($('#main'),(id,k)=>{if(id==='days')go('day',{date:k})});
  $$('[data-nav]').forEach(el=>el.onclick=()=>{const v=el.dataset.nav;go('day',{date:v==='today'?(dayObj(todayIso())?todayIso():days[0].date):days[+v].date})});
  if(S.ui.focus!=null){const el=$('#blk-'+hash(S.ui.focus));if(el)setTimeout(()=>el.scrollIntoView({behavior:reduced?'auto':'smooth',block:'center'}),80);S.ui.focus=null}}

/* ==== Tracks ==== */
const TRACK_TABS=['workout','meal','firearms','caselaw','policy','app'];
function weekSchedule(tr){const rows=week().days.flatMap(d=>d.blocks.map(b=>({d,b})).filter(x=>x.b.track===tr));
  if(!rows.length)return '<div class="empty">Nothing scheduled this week.</div>';
  return table(['Day','Time','Block','Done'],rows.map(({d,b})=>[`<span class="num">${fmtD(d.date)}</span>`,`<span class="num">${b.start}–${b.end}</span>`,`<a href="#" data-drawer="${esc(b.bid)}">${esc(b.title)}</a>${b.flex?' <span class="faint small">(optional)</span>':''}${b.status?' <span class="faint small">('+b.status+')</span>':''}`,`<span class="num">${blockPct(b)}%</span>`]))}
function trackSections(tr){const f=R.firearms,n=R.nutrition,st=R.standards;const S2=[];const add=(t,b,sub)=>S2.push({t,b,sub});
  add('This week’s schedule',weekSchedule(tr),'Tap a block to open it');
  if(tr==='workout'){['pat','vswat'].forEach(k=>add(st[k].title,table(null,st[k].events.map(e=>[`<b>${esc(e[0])}</b>`,esc(e[1]),`<span class="faint">${esc(e[2])}</span>`]))+list(st[k].form)+`<div class="faint small">Source: ${esc(st[k].source)}</div>`));
    add('Training structure: pre-shift + optional flex hour',list(['Primary session: BEFORE shift at the home gym (~16:00) or the work gym right before shift.','Optional on-shift flex hour at the work gym only if calls allow: full 45–60 min, short 20–30 min, or skip. Never make it up.','No flex workout the night after a heavy session or the night before the hardest one.','Off days: home or work gym, mid-morning.']));
    add('AMRAP pacing strategy',list(R.pacing));add('Deadlift to 135: cues',list(R.deadlift_cues));add('Mobility menu',list(R.mobility));add('Pull-up progression',pullTable());
    add('Warm-ups',Object.entries(R.warmups).map(([k,v])=>`<h4 class="small">${esc(k)}</h4>${list(v)}`).join(''));
    Object.keys(R.sessions).forEach(id=>add(`${id} · ${R.sessions[id].name}`,sessionHtml(id),`~${R.sessions[id].dur} min · ${R.sessions[id].where||''}`))}
  if(tr==='meal'){add('Grocery list (shared live with the meal page)',groceryHtml(),'Checks sync with your wife’s page');add('Targets',table(null,n.targets.map(t=>[`<b>${esc(t[0])}</b>`,esc(t[1])])));add('Shift-day template',mealTpl('shift'));add('Off-day template',mealTpl('off'));
    add('Patrol rules',list(n.rules));add('Supplements',table(null,n.supplements.map(t=>[`<b>${esc(t[0])}</b>`,esc(t[1])])));
    R.recipes.forEach(r=>add(r.name,recipeBody(r),'Makes '+r.makes))}
  if(tr==='firearms'){add('Dry-fire safety rules (every session)',list(f.safety));add('Par-time ladder (dry)',parHtml()+'<div class="faint small mt-3">Dry pars run faster than live. Accuracy first.</div>');
    Object.keys(f.dry).forEach(k=>add(f.dry[k].name,dryHtml(k),f.dry[k].min+' min · home, before shift'));add(f.live.title,liveHtml());
    add('VSWAT Pistol qualification',courseTable(f.courses.pistol));add('VSWAT Carbine qualification',courseTable(f.courses.carbine)+`<div class="faint small mt-3">${esc(f.courses.rules)}</div>`);add('Gear',list(R.gear))}
  if(tr==='caselaw'){R.cases.forEach(c=>add(c.name,caseBody(c),c.day));add('Queued for week 2+',list(R.case_queue))}
  if(tr==='policy'){R.policy.forEach(p=>add(p.title,policyBody(p),p.day));add('Pull from your own copy (PowerDMS / Valley SWAT)',list(R.pull_from_powerdms))}
  if(tr==='app'){add('Deliverables & letter outline',appHtml('all'));add('Milestones',milestones())}
  return S2}
function renderTracks(){const tr=TRACK_TABS.includes(S.ui.track)?S.ui.track:'workout';
  const intro={workout:'Primary session before shift. Optional flex hour on shift, if calls allow.',meal:'3 meals + 1 shake. Your wife runs prep from the family meal page.',firearms:'Dry fire at home before shift. Live fire Sunday.',caselaw:'Read the holding, write 3–5 bullets, then answer the quiz out loud.',policy:'One reading a day, off shift.',app:'Letter of interest + supervisor recommendation, due Mon Dec 7 09:00.'}[tr];
  const secs=trackSections(tr),hasIdx=S.ui.openIdx!=null,openIdx=hasIdx?+S.ui.openIdx:0;
  if(hasIdx)S.ui.open[ctxKey()]=Object.fromEntries(secs.map((x,i)=>['t-'+slug(x.t),i===openIdx]));
  let h=`<section class="view"><div class="page-head"><div><div class="eyebrow">${esc(week().label)}</div><h1>Tracks</h1></div></div>
    <div class="mb-4" style="overflow-x:auto">${tabsHtml('tracks',TRACK_TABS.map(k=>({key:k,c:tcol(k),html:`<span class="tab__dot"></span>${esc(tlabel(k))}`})),tr,{pill:true,label:'Tracks'})}</div>
    <div id="trackPanel" class="view" role="tabpanel" aria-labelledby="tab-tracks-${tr}"><p class="muted my-5">${esc(intro)}</p>${tr==='meal'?`<div class="mb-4">${mealsLink()}</div>`:''}
    ${tr==='caselaw'?'<div class="callout callout--info mb-4">Verified against the opinions and official reporters. Tap an answer to reveal it.</div>':''}
    ${secs.map((s,i)=>acc(esc(s.t),s.b,{open:i===0,id:'t-'+slug(s.t),sub:s.sub?esc(s.sub):''})).join('')}</div></section>`;
  $('#main').innerHTML=h;S.ui.openIdx=null;save();animateIn($('#main'));updateGProg();
  bindTabs($('#main'),(id,k)=>{if(id==='tracks'){clearTimeout(scrollT);S.ui.track=k;save();renderTracks();restoreScroll()}});
  const o=$$('#trackPanel details.acc')[openIdx];if(hasIdx&&o&&openIdx>0)setTimeout(()=>o.scrollIntoView({block:'start',behavior:'auto'}),30)}
function groceryModel(){return MP.grocery.map(([sec,items])=>{const list=items.map((t,i)=>({id:'g|'+sec+'|'+i,text:t})).filter(x=>!S.medits['gdel|'+x.id]);
  Object.entries(S.medits).forEach(([k,v])=>{if(k.startsWith('gadd|')&&v&&v.section===sec)list.push({id:'g|add|'+k.slice(5),text:v.text,added:true})});return [sec,list]})}
function groceryHtml(){const M=groceryModel();return `<div data-gprog><div class="row mb-4"><div class="bar" style="flex:1"><div class="bar__fill" style="--c:var(--t-meal)"></div></div><span class="num faint small" data-gcount></span></div>
  <div class="grid grid-2 grid--tight">${M.map(([sec,list])=>`<div><h4 class="small" style="color:var(--t-meal)">${esc(sec)}</h4><ul class="checklist">${list.map(x=>{const uid='m'+hash(x.id);return `<li><label class="check" for="${uid}"><input type="checkbox" id="${uid}" data-mchk="${esc(x.id)}" ${S.mchecks[x.id]?'checked':''}><span class="check__box">${CHECK_SVG}</span><span class="check__text">${esc(x.text)}${x.added?' <span class="faint small">(added)</span>':''}</span></label></li>`}).join('')}</ul></div>`).join('')}</div></div>`}
function updateGProg(){const g=$('[data-gprog]');if(!g)return;const ids=groceryModel().flatMap(([,l])=>l.map(x=>x.id)),n=ids.filter(i=>S.mchecks[i]).length;$('[data-gcount]',g).textContent=n+' / '+ids.length;requestAnimationFrame(()=>$('.bar__fill',g).style.width=(ids.length?100*n/ids.length:0)+'%')}
document.addEventListener('click',e=>{const a=e.target.closest('[data-drawer]');if(!a)return;e.preventDefault();openDrawer(a.dataset.drawer,a)});
function milestones(){const n=Date.now();return R.milestones.map(m=>{const t=new Date(m.at+':00-08:00');return `<div class="milestone ${t<n?'is-past':''} ${m.hard?'is-hard':''}"><span class="num faint">${t.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Los_Angeles'})} PT</span><b>${esc(m.label)}</b></div>`}).join('')}
/* ==== Progress ==== */
function spark(vals){if(vals.length<2)return '<div class="faint small mt-3">Log 2+ entries to see a trend.</div>';const W=300,H=56,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${(H-6-(v-mn)/r*(H-12)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
const patPass=t=>+t.push>=20&&+t.sit>=25&&+t.sq>=35;
function renderDash(){const w=week();const blocks=w.days.flatMap(d=>d.blocks);const all=w.days.flatMap(d=>itemIds(d).concat(anchorIds(d)));
  const body=S.logs.body.slice().sort((a,b)=>a.date.localeCompare(b.date)),lastW=body.length?body[body.length-1].weight:null;
  const tests=S.logs.tests.slice().sort((a,b)=>a.date.localeCompare(b.date)),lt=tests[tests.length-1];
  const best=c=>{const v=S.logs.quals.filter(q=>q.course===c).map(q=>+q.points).filter(x=>!isNaN(x));return v.length?Math.max(...v):'–'};
  let h=`<section class="view"><div class="page-head"><div><div class="eyebrow">${esc(w.label)}</div><h1>Progress</h1></div></div>
  <div class="grid grid-2" id="bigcd"></div>
  <div class="grid grid-3 mt-5">
    <div class="card"><div class="kpi__label">Week completion</div><div class="row" style="margin-top:var(--s3)">${ring(pct(all),84,7)}<div class="muted small">${all.filter(i=>S.checks[i]).length} of ${all.length} items<br>incl. daily anchors</div></div></div>
    <div class="card"><div class="kpi__label">Body weight (latest)</div><div class="kpi__value kpi__value--sm">${lastW?esc(lastW)+' lb':'–'}</div>${spark(body.map(b=>+b.weight).filter(Boolean))}<div class="faint small">Deadlift test load (75% BW) ≈ <b>${lastW?(Math.round(lastW*.75/2.5)*2.5)+' lb':'135 lb'}</b></div></div>
    <div class="card"><div class="kpi__label">Latest fitness test</div>${lt?`<div class="kpi__value kpi__value--sm">PAT ${esc(lt.push||'–')}/${esc(lt.sit||'–')}/${esc(lt.sq||'–')}</div><span class="tag ${patPass(lt)?'tag--ok':'tag--bad'}">${patPass(lt)?'PAT pass':'PAT not yet'}</span><div class="faint small mt-3">Pull-ups ${esc(lt.pull||'–')} · DL ${esc(lt.dl||'–')} · VSWAT ${esc(lt.v1||'–')} | ${esc(lt.v2||'–')} | ${esc(lt.v3||'–')}</div>`:'<div class="muted mt-3">Log your baseline (Sun 11/29).</div>'}
      <div class="faint small mt-3">Best VSWAT qual: pistol <b>${best('VSWAT Pistol')}</b> · carbine <b>${best('VSWAT Carbine')}</b> / 40</div></div>
  </div>
  <div class="grid grid-2 mt-5"><div class="card"><div class="card__title">By track</div><div class="stack">${TRACK_ORDER.map(k=>{const ids=blocks.filter(b=>b.track===k).flatMap(b=>b.items.map(i=>i.id));if(!ids.length)return '';const p=pct(ids);
      return `<div class="stat"><div class="stat__row"><span><span class="tab__dot" style="--c:${tcol(k)}"></span>${esc(tlabel(k))}</span><span>${ids.filter(i=>S.checks[i]).length}/${ids.length} · ${p}%</span></div>${bar(p,tcol(k))}</div>`}).join('')}
      <div class="stat"><div class="stat__row"><span><span class="tab__dot" style="--c:var(--accent)"></span>Daily anchors</span><span>${pct(w.days.flatMap(anchorIds))}%</span></div>${bar(pct(w.days.flatMap(anchorIds)))}</div></div></div>
    <div class="card"><div class="card__title">By day</div><div class="stack">${w.days.map(d=>{const p=dayPct(d);return `<div class="stat"><div class="stat__row"><a href="#" data-day="${d.date}">${fmtD(d.date)} · ${esc(d.title)}</a><span>${p}%</span></div>${bar(p,p===100?'var(--ok)':'')}</div>`}).join('')}</div></div></div>
  <div class="card mt-5"><div class="card__title">Milestones</div>${milestones()}</div></section>`;
  $('#main').innerHTML=h;renderCountdowns();animateIn($('#main'));
  $$('[data-day]').forEach(a=>a.onclick=e=>{e.preventDefault();go('day',{date:a.dataset.day})})}

/* ==== Logs ==== */
const fld=(n,l,t='number',v='',extra='')=>`<label class="field">${l}<input class="input" name="${n}" type="${t}" value="${esc(v)}" ${t==='number'?'step="any" inputmode="decimal"':''} ${extra}></label>`;
function logTable(rows,cols,key){if(!rows.length)return '<div class="empty">No entries yet.</div>';
  return table(cols.map(c=>c[1]).concat(['']),rows.map(r=>cols.map(c=>`<span class="num">${c[2]?c[2](r):esc(r[c[0]]??'')}</span>`).concat([`<button class="btn btn--sm btn--danger" data-del="${key}|${esc(r._id)}" aria-label="Delete entry">✕</button>`])))}
const LOG_TABS=[['body','Body'],['tests','Fitness tests'],['quals','Qual scores'],['dry','Dry-fire pars']];
function renderLogs(){const lt=LOG_TABS.some(t=>t[0]===S.ui.logTab)?S.ui.logTab:'body',T=todayIso(),desc=k=>S.logs[k].slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));let body='';
  if(lt==='body')body=`<form class="form-grid" data-log="body">${fld('date','Date','date',T)}${fld('weight','Weight (lb)')}${fld('rhr','Resting HR')}${fld('sleep','Sleep (h)')}<button class="btn btn--primary">Add entry</button></form>
    ${spark(S.logs.body.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(b=>+b.weight).filter(Boolean))}<div class="mt-4">${logTable(desc('body'),[['date','Date'],['weight','Lb'],['rhr','RHR'],['sleep','Sleep']],'body')}</div>`;
  if(lt==='tests')body=`<form class="form-grid" data-log="tests">${fld('date','Date','date',T)}<label class="field">Type<select class="select" name="kind"><option>Baseline</option><option>Checkpoint</option><option>Practice</option><option>Selection</option></select></label>${fld('pull','Pull-up max')}${fld('push','PAT push-ups')}${fld('sit','PAT sit-ups')}${fld('sq','Squat thrusts')}${fld('dl','DL clean load')}${fld('v1','VSWAT 10-min','text','','placeholder="7+5"')}${fld('v2','3-min #1','text','','placeholder="5+3"')}${fld('v3','3-min #2','text','','placeholder="5+0"')}${fld('notes','Notes / band','text')}<button class="btn btn--primary">Add test</button></form>
    <div class="mt-5">${logTable(desc('tests'),[['date','Date'],['kind','Type'],['pull','PU'],['push','Push'],['sit','Sit'],['sq','SqT'],['pat','PAT',r=>patPass(r)?'<span class="ok">PASS</span>':'<span class="bad">NO</span>'],['dl','DL'],['v1','10m'],['v2','3m#1'],['v3','3m#2'],['notes','Notes']],'tests')}</div>`;
  if(lt==='quals')body=`<div class="form-grid"><label class="field">Date<input class="input" id="qdate" type="date" value="${T}"></label><label class="field">Course<select class="select" id="qcourse"><option>VSWAT Pistol</option><option>VSWAT Carbine</option><option>FWPD Pistol (pass/fail)</option><option>FWPD Rifle (pass/fail)</option></select></label></div><div id="qsheet" class="mt-5"></div>
    <div class="section-title section-title--spaced">History</div>${logTable(desc('quals'),[['date','Date'],['course','Course'],['points','Pts'],['misses','Miss'],['over','OT'],['result','Result']],'quals')}`;
  if(lt==='dry')body=`<form class="form-grid" data-log="dry">${fld('date','Date','date',T)}<label class="field">Skill<select class="select" name="skill">${R.firearms.par_table.map(p=>`<option>${esc(p[0])}</option>`).join('')}</select></label>${fld('best','Best (s)')}${fld('avg','Avg (s)')}<button class="btn btn--primary">Add</button></form>
    <div class="mt-5">${logTable(desc('dry'),[['date','Date'],['skill','Skill'],['best','Best'],['avg','Avg'],['vs','vs target',r=>{const p=R.firearms.par_table.find(x=>x[0]===r.skill);if(!p)return '';return +r.best<=parseFloat(p[2])?'<span class="ok">✓ '+esc(p[2])+'</span>':'<span class="bad">'+esc(p[2])+'</span>'}]],'dry')}</div>`;
  $('#main').innerHTML=`<section class="view"><div class="page-head"><div><div class="eyebrow">Saved in this browser</div><h1>Logs</h1></div></div><div class="mb-4" style="overflow-x:auto">${tabsHtml('logs',LOG_TABS.map(([k,l])=>({key:k,label:l})),lt,{pill:true,label:'Log type'})}</div><div class="card view" role="tabpanel">${body}</div></section>`;
  bindTabs($('#main'),(id,k)=>{S.ui.logTab=k;save();renderLogs()});
  $$('form[data-log]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f).entries());o._id=Date.now()+Math.random().toString(36).slice(2,6);o.kind=f.dataset.log;SYNC.put('log',o.kind+'|'+o._id,o);hydrate();save();toast('Saved');renderLogs()});
  $$('[data-del]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.del.split('|');if(!confirm('Delete this entry?'))return;SYNC.put('log',k+'|'+id,null);hydrate();save();renderLogs()});
  if(lt==='quals')qualSheet()}
function addLog(kind,o){o._id=Date.now()+Math.random().toString(36).slice(2,6);o.kind=kind;SYNC.put('log',kind+'|'+o._id,o);hydrate();save()}
function qualSheet(){const pc=R.firearms.courses;const draw=()=>{const c=$('#qcourse').value,rows=c==='VSWAT Pistol'?pc.pistol:c==='VSWAT Carbine'?pc.carbine:null;
  if(!rows){$('#qsheet').innerHTML=`<div class="form-grid"><label class="field">Attempt #<input class="input" id="qatt" type="number" min="1" max="2" value="1"></label><label class="field">Result<select class="select" id="qpf"><option>PASS</option><option>FAIL</option></select></label><label class="field">Notes<input class="input" id="qnote" type="text"></label><button class="btn btn--primary" id="qsave">Save</button></div><div class="faint small mt-3">FWPD quals are pass/fail, ≤ 2 attempts.</div>`;
    $('#qsave').onclick=()=>{addLog('quals',{date:$('#qdate').value,course:c,points:'n/a',misses:'',over:'',result:$('#qpf').value+' (att '+$('#qatt').value+') '+$('#qnote').value});toast('Saved');renderLogs()};return}
  $('#qsheet').innerHTML=table(['#','Drill','Limit','Rds','Hits','Misses','OT rds'],rows.map((r,i)=>[r[0],`<span class="small">${esc(r[1])} · ${esc(r[2])}</span>`,`<span class="num">${esc(r[3])}</span>`,r[4],`<input class="input input--num" data-q="h" type="number" min="0" max="${r[4]}" value="${r[4]}">`,`<input class="input input--num" data-q="m" type="number" min="0" value="0">`,`<input class="input input--num" data-q="o" type="number" min="0" value="0">`]))+
    `<div class="row mt-4"><div class="kpi__value" id="qpts">40</div><div id="qres"></div><span class="spacer"></span><button class="btn btn--primary" id="qsave">Save score</button></div><div class="faint small">Points = hits − over-time rounds. Any miss fails the 100%-hits rule. Confirm zone scoring with VSWAT range staff.</div>`;
  const calc=()=>{let hh=0,m=0,o=0;$$('[data-q]').forEach(x=>{const v=+x.value||0;if(x.dataset.q==='h')hh+=v;if(x.dataset.q==='m')m+=v;if(x.dataset.q==='o')o+=v});const pts=hh-o,res=m>0?'FAIL (misses)':pts>=32?'PASS VSWAT (≥32)':pts>=28?'PASS FW-new only (≥28)':'BELOW MIN';
    $('#qpts').textContent=pts+' / 40';$('#qres').innerHTML=`<span class="tag ${m>0||pts<28?'tag--bad':pts>=32?'tag--ok':'tag--warn'}">${res}</span>`;return {pts,m,o,res}};
  $$('[data-q]').forEach(x=>x.oninput=calc);calc();
  $('#qsave').onclick=()=>{const r=calc();addLog('quals',{date:$('#qdate').value,course:c,points:r.pts,misses:r.m,over:r.o,result:r.res});toast('Score saved');renderLogs()}};
  $('#qcourse').onchange=draw;draw()}

/* ==== Settings ==== */
function editsList(){const E=Object.entries(S.edits);if(!E.length)return '<div class="empty">No edits yet. Open any block and tap Edit.</div>';
  const base={};PLAN.weeks.forEach(w=>w.days.forEach(d=>d.blocks.forEach(b=>base[b.id]=b)));
  return `<ul class="edits">${E.sort((a,b)=>a[0].localeCompare(b[0])).map(([k,o])=>{const add=k.startsWith('add|'),b=base[k],title=add?o.title:(o.title||(b&&b.title)||k);
    const what=add?'Added':o.deleted?'Deleted':Object.keys(o).filter(x=>x!=='short').join(', ');
    return `<li><div><b>${esc(title)}</b><div class="faint small">${fmtD(add?o.date:baseDate(k))} · ${esc(what)}</div></div><button class="btn btn--sm ${add?'btn--danger':''}" data-resetedit="${esc(k)}">${add?'Remove':o.deleted?'Restore':'Reset'}</button></li>`}).join('')}</ul>`}
function renderSettings(){const s=S.settings;
  $('#main').innerHTML=`<section class="view"><div class="page-head"><div><div class="eyebrow">Stored locally</div><h1>Settings</h1></div></div><div class="grid grid-2">
  <div class="card"><div class="card__title">Shift schedule</div><p class="muted small">Through 2026: Tue–Fri 20:30–06:30. From Jan 1, 2027: Fri–Mon 06:30–16:30. The calendar overlay and conflict warnings use these settings.</p>
    <div class="row mt-4">${DOW.map((d,i)=>`<label class="weekday-toggle"><input type="checkbox" data-sd="${i}" ${s.shiftDays.includes(i)?'checked':''}>${d}</label>`).join('')}</div>
    <div class="form-grid mt-5"><label class="field">Shift start<input class="input" id="ss" type="time" value="${s.shiftStart}"></label><label class="field">Shift end<input class="input" id="se" type="time" value="${s.shiftEnd}"></label>
    <label class="field">Calendar zoom<select class="select" id="zoom">${[[.8,'Compact'],[1.1,'Comfortable'],[1.4,'Large'],[1.8,'X-large']].map(([z,l])=>`<option value="${z}" ${Math.abs(z-s.ppm)<.01?'selected':''}>${l}</option>`).join('')}</select></label></div>
    <div class="row mt-5"><button class="btn btn--primary" id="saveS">Save schedule</button><button class="btn" id="p1">Preset: Tue–Fri nights</button><button class="btn" id="p2">Preset: Fri–Mon days (2027)</button></div></div>
  <div class="card"><div class="card__title">Data</div><p class="muted small">Checks, logs and settings live in this browser's localStorage (<span class="mono">${LS}</span>). Export a backup before clearing browser data or switching devices.</p>
    <div class="row mt-4"><button class="btn" id="exp">Export JSON</button><label class="btn">Import JSON<input type="file" id="imp" accept="application/json" hidden></label></div>
    <div class="row mt-4"><button class="btn btn--danger" id="rst">Reset checkboxes</button><button class="btn btn--danger" id="rstAll">Reset everything</button></div>
    ${acc('Adding future weeks',`<p>The plan is the <span class="mono">&lt;script id="plan-data"&gt;</span> JSON block, generated by <span class="mono">build-src/build.py</span>. Plan version <span class="mono">${esc(PLAN.meta.version)}</span>.</p>`,{cls:'acc--quiet'})}</div>
  <div class="card"><div class="card__title">Sync between devices</div><p class="muted small">${SYNC.configured?'Checks, logs, settings and plan edits sync through Supabase when you are signed in. Changes made offline wait in a queue and upload when you have signal. Use the status pill in the header to sign in, sync now or sign out.':'Sync is off (config.js is empty), so everything stays in this browser.'}</p><div id="syncHost2" class="mt-4"></div></div>
  <div class="card"><div class="card__title">Plan edits</div>${editsList()}</div></div></section>`;
  const setDays=a=>$$('[data-sd]').forEach(c=>c.checked=a.includes(+c.dataset.sd));
  $('#p1').onclick=()=>{setDays([2,3,4,5]);$('#ss').value='20:30';$('#se').value='06:30'};
  $('#p2').onclick=()=>{setDays([5,6,0,1]);$('#ss').value='06:30';$('#se').value='16:30'};
  $('#saveS').onclick=()=>{s.shiftDays=$$('[data-sd]:checked').map(c=>+c.dataset.sd);s.shiftStart=$('#ss').value;s.shiftEnd=$('#se').value;s.ppm=+$('#zoom').value;SYNC.put('settings','tracker',settingsPayload());invalidate();save();toast('Schedule saved')};
  if($('#syncHost2'))SchedSync.mountIndicator($('#syncHost2'),SYNC);
  $$('[data-resetedit]').forEach(b=>b.onclick=()=>{setEdit(b.dataset.resetedit,null);save();renderSettings();toast('Done')});
  $('#exp').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vswat-prep-backup-'+todayIso()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=normalize(JSON.parse(t)),L=[];Object.entries(o.checks).forEach(([id,v])=>L.push(['check',id,v]));
      Object.entries(o.logs).forEach(([k,arr])=>(arr||[]).forEach(x=>{if(x&&x._id)L.push(['log',k+'|'+x._id,Object.assign({kind:k},x)])}));
      Object.entries(o.edits||{}).forEach(([k,v])=>L.push(['edit',k,v]));S.settings=o.settings;L.push(['settings','tracker',settingsPayload()]);
      SYNC.putMany(L);hydrate();save();toast('Imported');render()}catch(err){alert('That file is not a valid backup.')}})};
  $('#rst').onclick=()=>{if(confirm('Clear all checkboxes?')){SYNC.putMany(Object.keys(S.checks).map(id=>['check',id,null]));hydrate();save();toast('Cleared')}};
  $('#rstAll').onclick=()=>{if(confirm('Delete ALL progress, logs, plan edits and settings? (This also clears them on your other devices.)')){
    SYNC.putMany([...Object.keys(S.checks).map(id=>['check',id,null]),...Object.values(S.logs).flat().map(x=>['log',x.kind+'|'+x._id,null]),...Object.keys(S.edits).map(k=>['edit',k,null]),['settings','tracker',null]]);
    localStorage.removeItem(LS);S=clone(DEFAULTS);hydrate();save();render()}}}

/* ==== Router ==== */
const RENDER={calendar:renderCalendar,day:renderDay,tracks:renderTracks,dash:renderDash,logs:renderLogs,settings:renderSettings};
function syncNav(){const tl=$('#nav');if(!tl)return;$$('[role=tab]',tl).forEach(t=>{const on=t.dataset.key===S.ui.view;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1});placeIndicator(tl)}
function renderView(){if(!RENDER[S.ui.view])S.ui.view='calendar';syncNav();$('#weekSelect').value=S.ui.week;RENDER[S.ui.view]();save()}
function render(){renderHeader();renderCountdowns();renderView()}
(function fromHash(){const p=new URLSearchParams(location.hash.slice(1));['view','date','week','track','logTab'].forEach(k=>{if(p.get(k)!=null)S.ui[k]=p.get(k)});if(p.get('open')!=null)S.ui.openIdx=p.get('open');
  if(p.get('date')&&!p.get('week')){const d=dayObj(p.get('date'));if(d)S.ui.week=d.week}
  if(!S.ui.date||!dayObj(S.ui.date)){const t=todayIso();S.ui.date=dayObj(t)?t:PLAN.weeks[0].days[0].date}
  render();restoreScroll();
  SchedSync.mountIndicator($('#syncHost'),SYNC);SYNC.init();
  const bq=p.get('block')||(p.get('view')?null:S.ui.drawer);if(!bq&&S.ui.drawer){S.ui.drawer=null;save()}if(bq)setTimeout(()=>{if(p.get('edit')!=null)openEditor(bq);else openDrawer(bq)},60);
  if(p.get('add')!=null)setTimeout(()=>openEditor(null,p.get('add')||S.ui.date),60)})();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>$$('[role=tablist]').forEach(tl=>placeIndicator(tl,true)));
})();
</script>
</body>
</html>
